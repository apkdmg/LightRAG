services:
  lightrag:
    image: ghcr.io/apkdmg/lightrag:latest
    build:
      context: .
      dockerfile: Dockerfile
      tags:
        - ghcr.io/apkdmg/lightrag:latest
    ports:
      - "${HOST:-0.0.0.0}:${PORT:-9621}:9621"
    volumes:
      - ./data/rag_storage:/app/data/rag_storage
      - ./data/inputs:/app/data/inputs
      - ./data/prompts:/app/data/prompts
      - ./data/logs:/app/data/logs
      - ./.env:/app/.env
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 10
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Cap the console log Docker keeps for this container (json-file driver).
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      WORKING_DIR: "/app/data/rag_storage"
      INPUT_DIR: "/app/data/inputs"
      PROMPT_DIR: "/app/data/prompts"
      # Text log, mounted from ./data/logs (create it owner-only first:
      # install -d -m 0700 data/logs). Container path only; never put in .env.
      LOG_DIR: "/app/data/logs"
      HOST: "0.0.0.0"
      PORT: "9621"
